[project]
name = "passrw"
version = "2.0.0"
description = "Telegram bot and admin console for tracking Belarusian railway tickets on pass.rw.by"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["telegram", "bot", "railway", "tickets", "belarus", "fastapi"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiogram>=3.15,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "jinja2>=3.1,<4",
    "itsdangerous>=2.2,<3",
    "argon2-cffi>=23.1,<26",
    "prometheus-client>=0.21,<1",
    "python-multipart>=0.0.12,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=7,<8",
    "respx>=0.21,<1",
    "ruff>=0.7,<1",
]

[project.scripts]
passrw = "passrw.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passrw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["passrw"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
