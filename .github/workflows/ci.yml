name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static checks (undefined names / syntax)
        run: python -m pyflakes ticket_bot.py admin_panel.py tracking_sync.py db.py tests

      - name: Compile
        run: python -m compileall -q ticket_bot.py admin_panel.py tracking_sync.py db.py

      - name: Tests
        env:
          TELEGRAM_TOKEN: "123456:CI_TEST_TOKEN"
          ADMIN_PASSWORD: "ci-test-password"
          SECRET_KEY: "ci-test-secret"
        run: python -m pytest -q
